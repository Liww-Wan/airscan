main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
h1{font-size:clamp(30px,8vw,38px);line-height:1.08;letter-spacing:-.03em;font-weight:600;margin:0 0 14px;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:34ch}
.link-viz{margin:44px 0 40px;color:var(--ink)}
.link-viz svg{width:100%;height:auto;display:block;overflow:visible}
.stroke{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.track{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-dasharray:.01 10;stroke-linecap:round}

@media (prefers-reduced-motion:no-preference){
  .track{animation:flow .9s linear infinite}
}
@keyframes flow{to{stroke-dashoffset:-10}}
.actions{display:grid;gap:10px}
button{font:inherit;cursor:pointer;border-radius:12px;height:52px;padding:0 18px;font-weight:600;font-size:16px;
  transition:transform .12s ease,background .15s ease,border-color .15s ease}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.primary{background:var(--ink);color:var(--on-ink);border:1px solid var(--ink)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ghost:hover{border-color:var(--muted)}
.view[hidden]{display:none}
.back{background:none;border:0;height:auto;padding:0;color:var(--muted);font-weight:500;font-size:15px;margin-bottom:28px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.field{display:flex;gap:8px;margin:24px 0 0}
input{flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:15px;padding:0 14px}
input::placeholder{color:var(--muted)}
.field button{flex:none}
.status{display:flex;align-items:center;gap:10px;margin-top:20px;color:var(--muted);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
.error{color:#d6455d;font-size:14px;margin-top:10px;min-height:1em}
footer{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding-top:20px;border-top:1px solid var(--line)}
footer nav{display:flex;gap:18px}
footer a{color:inherit;text-decoration:none}
.fi{display:inline-flex;align-items:center;gap:8px}
.fi svg{width:15px;height:15px;fill:currentColor;flex:none}
footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo" aria-hidden="true"></span>
    Airscan
  </header>

  <main>
    <section class="view" id="home">
      <h1>Envie arquivos direto entre seus aparelhos.</h1>
      <p class="lead">Do celular ao computador, sem nuvem e sem cadastro.</p>

      <div class="link-viz" aria-hidden="true">
        <svg viewBox="0 0 360 84">
          <g class="stroke"><rect x="6" y="10" width="34" height="64" rx="8"/><path d="M19 66h8"/></g>
          <defs><linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="64" x2="276" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="flowmask" maskUnits="userSpaceOnUse" x="56" y="30" width="228" height="24"><rect x="56" y="30" width="228" height="24" fill="url(#fade)"/></mask></defs><g mask="url(#flowmask)"><path class="track" d="M64 42h212"/></g>
          
          <g class="stroke"><rect x="300" y="20" width="56" height="34" rx="5"/><path d="M328 54v10M317 64h22"/></g>
        </svg>
      </div>

      <div class="actions">
        <button class="primary" id="btn-create">Criar conexão</button>
        <button class="ghost" id="btn-join">Tenho um link</button>
      </div>
    </section>

    <section class="view" id="create" hidden>
      <button class="back" data-back>← Voltar</button>
      <h1>Abra este link no outro aparelho.</h1>
      <p class="lead">Quando ele abrir, a conexão começa sozinha.</p>
      <div class="field">
        <input id="link" readonly aria-label="Link da conexão">
        <button class="primary" id="copy">Copiar</button>
      </div>
      <div class="status"><span class="dot"></span>Aguardando o outro aparelho</div>
    </section>

    <section class="view" id="join" hidden>
      <button class="back" data-back>← Voltar</button>
      <h1>Cole o link da conexão.</h1>
      <p class="lead">Ele foi criado no outro aparelho.</p>
      <div class="field">
        <input id="paste" placeholder="https://…" aria-label="Link recebido" autocomplete="off" inputmode="url">
        <button class="primary" id="go">Conectar</button>
      </div>
      <div class="error" id="err" role="alert"></div>
    </section>
  </main>

  <footer>
    <!-- Ícones: Font Awesome Free (CC BY 4.0) -->
    <span class="fi"><svg viewBox="0 0 640 512" aria-hidden="true"><path d="M384 32l128 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L398.4 96c-5.2 25.8-22.9 47.1-46.4 57.3l0 294.7 160 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-384 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l160 0 0-294.7c-23.5-10.3-41.2-31.6-46.4-57.3L128 96c-17.7 0-32-14.3-32-32s14.3-32 32-32l128 0c14.6-19.4 37.8-32 64-32s49.4 12.6 64 32zm55.6 288L584.4 320 512 195.8 439.6 320zM512 416c-62.9 0-115.2-34-126-78.9-2.6-11 1-22.3 6.7-32.1l95.2-163.2c5-8.6 14.2-13.8 24.1-13.8s19.1 5.3 24.1 13.8l95.2 163.2c5.7 9.8 9.3 21.1 6.7 32.1-10.8 44.8-63.1 78.9-126 78.9zM126.8 195.8L54.4 320 199.3 320 126.8 195.8zM.9 337.1c-2.6-11 1-22.3 6.7-32.1l95.2-163.2c5-8.6 14.2-13.8 24.1-13.8s19.1 5.3 24.1 13.8l95.2 163.2c5.7 9.8 9.3 21.1 6.7 32.1-10.8 44.8-63.1 78.9-126 78.9S11.7 382 .9 337.1z"/></svg>Licença MIT</span>
    <nav>
      <a href="https://github.com/liww-wan/airscan" target="_blank" rel="noopener" class="fi"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M216.5 362.5c-66-8-112.5-55.5-112.5-117 0-25 9-52 24-70-6.5-16.5-5.5-51.5 2-66 20-2.5 47 8 63 22.5 19-6 39-9 63.5-9s44.5 3 62.5 8.5c15.5-14 43-24.5 63-22 7 13.5 8 48.5 1.5 65.5 16 19 24.5 44.5 24.5 70.5 0 61.5-46.5 108-113.5 116.5 17 11 28.5 35 28.5 62.5l0 52C323 491.5 335.5 500 350.5 494 441 459.5 512 369 512 257 512 115.5 397 0 255.5 0S0 115.5 0 257c0 111 70.5 203 165.5 237.5 13.5 5 26.5-4 26.5-17.5l0-40c-7 3-16 5-24 5-33 0-52.5-18-66.5-51.5-5.5-13.5-11.5-21.5-23-23-6-.5-8-3-8-6 0-6 10-10.5 20-10.5 14.5 0 27 9 40 27.5 10 14.5 20.5 21 33 21s20.5-4.5 32-16c8.5-8.5 15-16 21-21z"/></svg>GitHub</a>
    </nav>
  </footer>
</div>

<script>
(function(){
  var views = ['home','create','join'];
  function show(id){
    views.forEach(function(v){ document.getElementById(v).hidden = (v !== id); });
  }
  function token(){
    var a = new Uint8Array(9);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function(_,i){a[i]=Math.random()*256});
    return Array.prototype.map.call(a,function(b){return b.toString(36).padStart(2,'0')}).join('').slice(0,14);
  }
  document.getElementById('btn-create').onclick = function(){
    // Ligue aqui a criação da oferta WebRTC; o link abaixo é só ilustrativo.
    var base = location.href.split('#')[0];
    document.getElementById('link').value = base + '#' + token();
    show('create');
  };
  document.getElementById('btn-join').onclick = function(){ show('join'); document.getElementById('paste').focus(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function(b){ b.onclick = function(){ show('home'); }; });

  document.getElementById('copy').onclick = function(){
    var el = document.getElementById('link'), btn = this;
    function done(){ btn.textContent = 'Copiado'; setTimeout(function(){ btn.textContent = 'Copiar'; }, 1600); }
    try { navigator.clipboard.writeText(el.value).then(done, function(){ el.select(); document.execCommand('copy'); done(); }); }
    catch(e){ el.select(); try{document.execCommand('copy');}catch(_){} done(); }
  };
  document.getElementById('go').onclick = function(){
    var v = document.getElementById('paste').value.trim(), err = document.getElementById('err');
    if (v.indexOf('#') === -1 || v.length < 8) { err.textContent = 'Link inválido. Cole o endereço completo.'; return; }
    err.textContent = '';
    // Ligue aqui a resposta WebRTC usando o trecho depois do "#".
  };
})();
</script>
</body>
</html>
